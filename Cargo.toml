[workspace]
resolver = "2"
members = [
    "crates/fixplay-core",
    "crates/fixplay-flashrom",
    "crates/fixplay-uart",
    "crates/fixplay-i2c",
    "src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/fabioudev/fixplay-diagnoseTool"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
thiserror   = "1"
tracing     = "0.1"
tokio       = { version = "1", features = ["full"] }
anyhow      = "1"
serde_json  = "1"
