[package]
name    = "fixplay-tauri"
version = "0.3.0"
edition = "2021"

[lib]
name       = "fixplay_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fixplay-core      = { path = "../crates/fixplay-core" }
fixplay-flashrom  = { path = "../crates/fixplay-flashrom" }
fixplay-uart      = { path = "../crates/fixplay-uart" }
fixplay-i2c       = { path = "../crates/fixplay-i2c" }
tauri         = { version = "2", features = [] }
open               = "5"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# File logging for release builds (rolling daily log file under the app's
# local-data dir); only loaded in non-debug builds via the `file-logging` code.
tracing-appender = "0.2"
dirs             = "6"
anyhow        = { workspace = true }
serialport    = "4"
hidapi        = "2"
# Cross-platform free/total disk-space query for the app-data volume (#43).
fs4           = "0.12"
