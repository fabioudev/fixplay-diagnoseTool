name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches tauri.conf.json version
        run: |
          # Everything downstream keys on the tag version (updater manifest,
          # AUR download URLs), but the bundle filenames embed the version
          # from tauri.conf.json. A drift silently produces a platforms-empty
          # latest.json and 404ing AUR packages with a green pipeline — fail
          # here instead, before anything is built.
          TAG_VERSION="${RELEASE_TAG#v}"
          CONF_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match tauri.conf.json version $CONF_VERSION. Bump tauri.conf.json and re-tag."
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.release_tag }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-bundles
            build_args: -- --bundles appimage,deb,rpm
            artifact_glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/appimage/*.AppImage.sig
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - os: windows-latest
            artifact_name: windows-bundles
            build_args: ""
            artifact_glob: |
              target/release/bundle/msi/*.msi
              target/release/bundle/msi/*.msi.zip
              target/release/bundle/msi/*.msi.zip.sig
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            squashfs-tools \
            libfuse2

      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin"

          curl -L \
            -o "$HOME/.local/bin/linuxdeploy.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/linuxdeploy.AppImage"

          cat > "$HOME/.local/bin/linuxdeploy" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          exec "$HOME/.local/bin/linuxdeploy.AppImage" "$@"
          EOF
          chmod +x "$HOME/.local/bin/linuxdeploy"

          curl -L \
            -o "$HOME/.local/bin/appimagetool.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/appimagetool.AppImage"

          cat > "$HOME/.local/bin/appimagetool" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          exec "$HOME/.local/bin/appimagetool.AppImage" "$@"
          EOF
          chmod +x "$HOME/.local/bin/appimagetool"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Bundle latest Error DB
        run: |
          curl -fsSL "https://raw.githubusercontent.com/amoamare/Console-Service-Tool/master/Resources/ErrorCodes.json" -o src-tauri/resources/error_codes.json
          node -e "const d=JSON.parse(require('fs').readFileSync('src-tauri/resources/error_codes.json','utf8'));const ok=d&&typeof d==='object'&&Object.values(d).some(v=>v&&Array.isArray(v.ErrorCodes)&&v.ErrorCodes.length>0);if(!ok){console.error('Error DB empty or invalid');process.exit(1)}"

      # ── Build a real Windows flashrom.exe from upstream source ─────────────
      # The committed src-tauri/binaries/flashrom.exe is a 0-byte placeholder
      # (kept so `tauri build`'s resource declaration resolves in dev). For
      # releases we overwrite it with a freshly built flashrom so the Windows
      # app actually works out of the box — no manual binary for the user.
      # This step is Windows-only and intentionally fails loudly if the flashrom
      # toolchain/flags disagree, so we iterate here rather than ship a broken
      # bundle. PIN NOTE: flashrom v1.5.0+ dropped the Makefile and is meson-only
      # (meson.build + ninja). v1.4.0 still ships the classic Makefile with the
      # CONFIG_* flags used below — stay on v1.4.0 for the make-based flow, or
      # rewrite this step to `meson setup ... -Dch341a_spi=enabled && ninja` if
      # you want to move to a newer flashrom.
      - name: Setup MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libusb make pkg-config git

      - name: Build flashrom.exe (Windows only)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          FLASHROM_REF: v1.4.0
        run: |
          set -euo pipefail
          # Capture the checkout root before we cd away — $GITHUB_WORKSPACE is a
          # Windows backslash path that msys2 bash can't use directly.
          WORK="$PWD"
          git clone --depth 1 --branch "$FLASHROM_REF" https://github.com/flashrom/flashrom.git /tmp/flashrom
          cd /tmp/flashrom
          # Minimal programmer set for the workshop: CH341A SPI (libusb) + the
          # common serial programmers. Disable internal/PCI programmers (they
          # need kernel portio we don't ship on Windows), the RAIDen USB
          # debugger (not needed here), and FT2232_SPI — FT2232 needs libftdi
          # (ftdi.h), which isn't in the MSYS2 install below and would make the
          # build fragile for a programmer the CH341A workshop doesn't use.
          # Re-enable by adding mingw-w64-ucrt-x86_64-libftdi + CONFIG_FT2232_SPI=yes.
          # Note: v1.4.0 has no CONFIG_RAID/CONFIG_USB vars — only
          # CONFIG_RAIDEN_DEBUG_SPI and the implicit libusb1 programmer group.
          # LDFLAGS=-static links libusb-1.0 and winpthread statically: a
          # dynamically linked exe imports libusb-1.0.dll / libwinpthread-1.dll
          # that the installer doesn't bundle, and every flash dies at spawn
          # with a missing-DLL error (verified on the published v0.3.0
          # installer). If -static ever breaks the link, this step fails loudly
          # in CI instead of shipping a broken exe.
          make CC=gcc LDFLAGS="-static" \
            CONFIG_INTERNAL=no \
            CONFIG_SERPROG=yes \
            CONFIG_BUSPIRATE_SPI=yes \
            CONFIG_FT2232_SPI=no \
            CONFIG_CH341A_SPI=yes \
            CONFIG_DEDIPROG=yes \
            CONFIG_PONY_SPI=yes \
            CONFIG_RAIDEN_DEBUG_SPI=no
          # flashrom produces `flashrom.exe` under mingw.
          test -s flashrom.exe
          cp flashrom.exe "$WORK/src-tauri/binaries/flashrom.exe"
          echo "Staged flashrom.exe: $(ls -l "$WORK/src-tauri/binaries/flashrom.exe")"

      # ── Build a real Linux flashrom from upstream source ───────────────────
      # Same rationale as the Windows step: the committed src-tauri/binaries/
      # flashrom is a placeholder stub, and shipping it makes every flash
      # operation fail at spawn (and used to shadow a working system flashrom
      # until the runtime placeholder guard was added). Overwrite it with a
      # freshly built flashrom so Linux releases work out of the box.
      - name: Install flashrom build dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          # With CONFIG_INTERNAL=no flashrom needs only libusb-1.0 (CH341A and
          # the other USB programmers) and pkg-config; libpci is NOT needed.
          sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Build flashrom (Linux only)
        if: runner.os == 'Linux'
        env:
          FLASHROM_REF: v1.4.0
        run: |
          set -euo pipefail
          WORK="$PWD"
          git clone --depth 1 --branch "$FLASHROM_REF" https://github.com/flashrom/flashrom.git /tmp/flashrom
          cd /tmp/flashrom
          # Same programmer set as the Windows build (see the MSYS2 step for
          # the full rationale) and the same loud-failure philosophy.
          make \
            CONFIG_INTERNAL=no \
            CONFIG_SERPROG=yes \
            CONFIG_BUSPIRATE_SPI=yes \
            CONFIG_FT2232_SPI=no \
            CONFIG_CH341A_SPI=yes \
            CONFIG_DEDIPROG=yes \
            CONFIG_PONY_SPI=yes \
            CONFIG_RAIDEN_DEBUG_SPI=no
          test -s flashrom
          cp flashrom "$WORK/src-tauri/binaries/flashrom"
          echo "Staged flashrom: $(ls -l "$WORK/src-tauri/binaries/flashrom")"

      - name: Build Tauri bundles
        env:
          # When set, Tauri signs the updater bundles and emits .sig files
          # (required for the in-app updater to verify downloads). If the
          # secrets are absent the build still succeeds — just without sigs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build ${{ matrix.build_args }}

      - name: Strip bundled libwayland-client from AppImage (repack + re-sign)
        if: matrix.artifact_name == 'linux-bundles'
        env:
          # Same signing env as the build step. The repack invalidates the
          # .sig the build produced, so re-sign here (tauri signer reads these
          # env vars) — the in-app updater still verifies against the public
          # key in tauri.conf.json plugins.updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for img in target/release/bundle/appimage/*.AppImage; do
            # Make the glob result absolute — we cd into a temp dir below to
            # run the AppImage's --appimage-extract, and a relative path
            # wouldn't resolve from there (exit 127, "command not found").
            img="$(cd "$(dirname "$img")" && pwd)/$(basename "$img")"
            echo "::group::repack $img"
            work="$(mktemp -d)"
            ( cd "$work" && "$img" --appimage-extract >/dev/null 2>&1 )
            root="$work/squashfs-root"
            # libwayland-client.so.0 must come from the host (Wayland compositor
            # side); a bundled copy breaks EGL/GL context creation (tauri#8541
            # -> blank window). Tauri's AppImage bundler downloads its OWN
            # linuxdeploy (ignores the one on PATH), so the lib can't be
            # excluded during bundling — strip it from the built AppImage and
            # repack. libGL/libEGL/libdrm are already not bundled (linuxdeploy
            # blacklist); libwayland-server is left (a NEEDED dep of a bundled
            # lib; removing risks a load failure for no EGL benefit).
            rm -fv "$root"/usr/lib/libwayland-client.so.0* 2>/dev/null || true
            # Repack the AppImage in place (the appimagetool wrapper on PATH
            # sets APPIMAGE_EXTRACT_AND_RUN=1 so it runs without FUSE on CI).
            appimagetool "$root" "$img" >/dev/null
            rm -rf "$work"
            # Regenerate the .sig for the repacked AppImage (the build's .sig
            # was for the pre-repack AppImage; drop it so signer writes fresh).
            rm -f "$img".sig
            npx tauri signer sign "$img"
            echo "::endgroup::"
          done
          echo "repacked + re-signed AppImage(s):"
          ls -l target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  # ── Additional native targets: macOS + Linux/Windows ARM64 (#100, #101) ──
  # These are newer/experimental targets. They run in parallel with the main
  # `build` job but the `release` job does NOT depend on them, and the job has
  # `continue-on-error: true` — so a failure or an unavailable runner for any
  # of these never blocks a release. When they succeed, their `*-bundles`
  # artifacts are still picked up by the release's download-artifact step
  # (pattern `*-bundles`) and shipped. macOS is unsigned (no signing/notarization
  # configured yet). Linux ARM64 and macOS build a native flashrom from source
  # (step-level continue-on-error: a flashrom failure degrades to the
  # placeholder + runtime guard, it doesn't kill the target).
  build-extra:
    needs: prepare
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos-bundles
            build_args: -- --bundles dmg
            artifact_glob: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/dmg/*.dmg.sig
          - os: ubuntu-24.04-arm
            artifact_name: linux-arm64-bundles
            build_args: -- --bundles deb,rpm
            artifact_glob: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - os: windows-11-arm
            artifact_name: windows-arm64-bundles
            build_args: ""
            artifact_glob: |
              target/release/bundle/msi/*.msi
              target/release/bundle/msi/*.msi.zip
              target/release/bundle/msi/*.msi.zip.sig
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            libusb-1.0-0-dev \
            pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Bundle latest Error DB
        run: |
          curl -fsSL "https://raw.githubusercontent.com/amoamare/Console-Service-Tool/master/Resources/ErrorCodes.json" -o src-tauri/resources/error_codes.json
          node -e "const d=JSON.parse(require('fs').readFileSync('src-tauri/resources/error_codes.json','utf8'));const ok=d&&typeof d==='object'&&Object.values(d).some(v=>v&&Array.isArray(v.ErrorCodes)&&v.ErrorCodes.length>0);if(!ok){console.error('Error DB empty or invalid');process.exit(1)}"

      # ── Native flashrom for the experimental targets ───────────────────────
      # Same flags as the main `build` job (see the MSYS2/Linux steps there).
      # These targets are experimental (job-level continue-on-error), so a
      # flashrom build failure here must not kill the whole job: step-level
      # continue-on-error keeps the bundles shipping (the placeholder stub +
      # runtime guard then degrade to "flashrom on PATH" as before).
      - name: Build flashrom (Linux/macOS only)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        continue-on-error: true
        env:
          FLASHROM_REF: v1.4.0
        run: |
          set -euo pipefail
          WORK="$PWD"
          git clone --depth 1 --branch "$FLASHROM_REF" https://github.com/flashrom/flashrom.git /tmp/flashrom
          cd /tmp/flashrom
          make \
            CONFIG_INTERNAL=no \
            CONFIG_SERPROG=yes \
            CONFIG_BUSPIRATE_SPI=yes \
            CONFIG_FT2232_SPI=no \
            CONFIG_CH341A_SPI=yes \
            CONFIG_DEDIPROG=yes \
            CONFIG_PONY_SPI=yes \
            CONFIG_RAIDEN_DEBUG_SPI=no
          test -s flashrom
          cp flashrom "$WORK/src-tauri/binaries/flashrom"
          echo "Staged flashrom: $(ls -l "$WORK/src-tauri/binaries/flashrom")"

      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build ${{ matrix.build_args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  arch-build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git rust nodejs npm curl \
            webkit2gtk-4.1 gtk3 libayatana-appindicator \
            librsvg patchelf zstd \
            systemd-libs hidapi flashrom

      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle latest Error DB
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/amoamare/Console-Service-Tool/master/Resources/ErrorCodes.json" \
            -o src-tauri/resources/error_codes.json
          # Same validity gate as the other build jobs — a truncated/HTML
          # error page must fail the build, not ship as a silently empty DB.
          node -e "const d=JSON.parse(require('fs').readFileSync('src-tauri/resources/error_codes.json','utf8'));const ok=d&&typeof d==='object'&&Object.values(d).some(v=>v&&Array.isArray(v.ErrorCodes)&&v.ErrorCodes.length>0);if(!ok){console.error('Error DB empty or invalid');process.exit(1)}"

      - name: Install npm dependencies
        run: npm ci

      - name: Build (Tauri CLI — embeds frontend correctly)
        run: npm run tauri build -- --no-bundle

      - name: Create pacman package
        run: |
          VERSION="${{ needs.prepare.outputs.release_tag }}"
          VERSION="${VERSION#v}"

          # makepkg refuses to run as root — create a dedicated builder user
          useradd -m builder

          # Copy pre-built artifacts to a builder-owned staging area
          mkdir -p /tmp/pkgbuild/files
          cp "target/release/fixplay-tauri"           /tmp/pkgbuild/files/
          cp "src-tauri/resources/error_codes.json"   /tmp/pkgbuild/files/
          cp "src-tauri/resources/xbox_error_codes.json" /tmp/pkgbuild/files/
          # Ship the distro flashrom binary instead of the committed placeholder
          # stub — the stub fails every flash operation at spawn. The pacman
          # `flashrom` install above is the same binary the `depends` entry
          # pulls in on user machines, so bundling it keeps the packaged app
          # working even when PATH resolution changes.
          cp "/usr/bin/flashrom"                      /tmp/pkgbuild/files/flashrom
          cp "src-tauri/icons/icon_256x256.png"       /tmp/pkgbuild/files/

          printf '[Desktop Entry]\nName=fixplay-diagnoseTool\nComment=Cross-platform diagnostic tool for gaming consoles\nExec=fixplay-diagnosetool\nIcon=fixplay-diagnosetool\nType=Application\nCategories=Utility;Development;\nTerminal=false\nStartupNotify=true\n' \
            > /tmp/pkgbuild/files/fixplay-diagnosetool.desktop

          # Generate PKGBUILD — package() references ${startdir}/files/ only
          {
            echo "pkgname=fixplay-diagnosetool"
            echo "pkgver=${VERSION}"
            echo "pkgrel=1"
            echo 'pkgdesc="Cross-platform diagnostic tool for gaming consoles"'
            echo "arch=('x86_64')"
            echo 'url="https://github.com/fabioudev/fixplay-diagnoseTool"'
            echo "license=('custom:unknown')"
            echo "depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'flashrom')"
            echo "provides=('fixplay-diagnosetool')"
            echo "conflicts=('fixplay-diagnosetool-bin')"
            echo "source=()"
            echo "sha256sums=()"
            echo ""
            echo "package() {"
            echo '  install -Dm755 "${startdir}/files/fixplay-tauri"                   "${pkgdir}/usr/bin/fixplay-diagnosetool"'
            echo '  install -Dm644 "${startdir}/files/error_codes.json"                "${pkgdir}/usr/lib/fixplay-diagnosetool/resources/error_codes.json"'
            echo '  install -Dm644 "${startdir}/files/xbox_error_codes.json"           "${pkgdir}/usr/lib/fixplay-diagnosetool/resources/xbox_error_codes.json"'
            echo '  install -Dm755 "${startdir}/files/flashrom"                        "${pkgdir}/usr/lib/fixplay-diagnosetool/binaries/flashrom"'
            echo '  install -Dm644 "${startdir}/files/icon_256x256.png"               "${pkgdir}/usr/share/icons/hicolor/256x256/apps/fixplay-diagnosetool.png"'
            echo '  install -Dm644 "${startdir}/files/fixplay-diagnosetool.desktop"   "${pkgdir}/usr/share/applications/fixplay-diagnosetool.desktop"'
            echo "}"
          } > /tmp/pkgbuild/PKGBUILD

          chown -R builder:builder /tmp/pkgbuild
          su builder -c "cd /tmp/pkgbuild && PACKAGER='GitHub Actions' makepkg --noconfirm --nodeps"
          cp /tmp/pkgbuild/fixplay-diagnosetool-*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Upload arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-bundles
          if-no-files-found: error
          path: "*.pkg.tar.zst"

  release:
    needs:
      - prepare
      - build
      - build-extra
      - arch-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-bundles'
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate updater manifest (latest.json)
        run: |
          node scripts/generate-latest-json.mjs release-assets "${{ needs.prepare.outputs.release_tag }}" release-assets/latest.json
          echo "--- latest.json ---"
          cat release-assets/latest.json

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          # Exclude the checksum file itself — including it makes SHA256SUMS.txt
          # contain its own (impossible-to-verify) hash, and `sha256sum -c` fails
          # on the last line (verified on the published v0.3.0 release).
          find . -type f ! -name SHA256SUMS.txt | sort | xargs sha256sum > SHA256SUMS.txt
          # Fail loudly if the manifest lists anything that isn't a real file.
          sha256sum -c SHA256SUMS.txt

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: |
            release-assets/**
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.release_tag, '-') }}

  update-aur:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    if: "!contains(needs.prepare.outputs.release_tag, '-')"
    environment: aur-release
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install AUR tooling
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git openssh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        if: env.AUR_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur_deploy
          chmod 600 ~/.ssh/aur_deploy
          # Don't ssh-keyscan: in the archlinux container it wrote a host key
          # that mismatched what AUR presents on connect ("Host key verification
          # failed"), and even accept-new couldn't recover once a conflicting
          # entry existed. The Publish step uses GIT_SSH_COMMAND instead, which
          # bypasses the config + known_hosts entirely.
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur_deploy
              User aur
              IdentitiesOnly yes
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF

      - name: Publish packages to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        if: env.AUR_SSH_KEY != ''
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Bypass ~/.ssh/config + known_hosts entirely — GIT_SSH_COMMAND is
          # honored by every git ssh op (clone + push) in this script, and the
          # explicit -i + -o flags survive any HOME/container quirks. Host-key
          # checking is off (AUR is the only host we talk to here).
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          # makepkg refuses to run as root — use a dedicated builder user.
          useradd -m builder
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          publish() {
            local pkg="$1"
            local work="/tmp/aur-src/$pkg"
            mkdir -p "$work"
            cp "packaging/aur/$pkg/PKGBUILD" "$work/PKGBUILD"
            sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$work/PKGBUILD"
            sed -i "s/^pkgrel=.*/pkgrel=1/" "$work/PKGBUILD"

            # .SRCINFO from the real PKGBUILD metadata (no sources downloaded).
            chown -R builder:builder "$work"
            su builder -c "cd '$work' && makepkg --printsrcinfo > .SRCINFO"

            # Clone existing AUR repo, or init a fresh one — AUR creates the
            # package on the first push, so `git clone` failing just means we
            # bootstrap it locally.
            local repo="/tmp/aur-repo/$pkg"
            rm -rf "$repo"
            if git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "$repo" 2>/dev/null; then
              :
            else
              mkdir -p "$repo"
              git -C "$repo" init
              git -C "$repo" remote add origin "ssh://aur@aur.archlinux.org/${pkg}.git"
              git -C "$repo" checkout -b master
            fi
            cp "$work/PKGBUILD" "$work/.SRCINFO" "$repo/"
            git -C "$repo" add PKGBUILD .SRCINFO
            git -C "$repo" commit -m "Update to v$VERSION" || true
            git -C "$repo" push origin master
            echo "✅ published $pkg @ v$VERSION"
          }

          publish fixplay-diagnosetool-bin
          publish fixplay-diagnosetool

      - name: AUR status
        if: always()
        run: |
          if [ -z "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
            echo "## ⚠️ AUR_SSH_PRIVATE_KEY not configured"
            echo "Follow docs/AUR_SSH_SETUP.md and add the secret + the 'aur-release' environment."
          else
            echo "## AUR publish attempt finished (see previous step)."
          fi

