name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-bundles
            build_args: -- --bundles appimage,deb,rpm
            artifact_glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - os: windows-latest
            artifact_name: windows-bundles
            build_args: ""
            artifact_glob: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            squashfs-tools \
            libfuse2

      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin"

          curl -L \
            -o "$HOME/.local/bin/linuxdeploy.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/linuxdeploy.AppImage"

          cat > "$HOME/.local/bin/linuxdeploy" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          exec "$HOME/.local/bin/linuxdeploy.AppImage" "$@"
          EOF
          chmod +x "$HOME/.local/bin/linuxdeploy"

          curl -L \
            -o "$HOME/.local/bin/appimagetool.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/appimagetool.AppImage"

          cat > "$HOME/.local/bin/appimagetool" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          exec "$HOME/.local/bin/appimagetool.AppImage" "$@"
          EOF
          chmod +x "$HOME/.local/bin/appimagetool"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Bundle latest Error DB
        run: |
          curl -fsSL "https://raw.githubusercontent.com/amoamare/Console-Service-Tool/master/Resources/ErrorCodes.json" -o src-tauri/resources/error_codes.json
          node -e "const d=JSON.parse(require('fs').readFileSync('src-tauri/resources/error_codes.json','utf8'));const ok=d&&typeof d==='object'&&Object.values(d).some(v=>v&&Array.isArray(v.ErrorCodes)&&v.ErrorCodes.length>0);if(!ok){console.error('Error DB empty or invalid');process.exit(1)}"

      - name: Build Tauri bundles
        run: npm run tauri build ${{ matrix.build_args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  arch-build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git rust nodejs npm curl \
            webkit2gtk-4.1 gtk3 libayatana-appindicator \
            librsvg patchelf zstd

      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle latest Error DB
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/amoamare/Console-Service-Tool/master/Resources/ErrorCodes.json" \
            -o src-tauri/resources/error_codes.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Rust binary
        env:
          TAURI_ENV_DEBUG: "false"
          TAURI_ENV_PLATFORM: linux
          TAURI_ENV_ARCH: x86_64
          TAURI_ENV_FAMILY: unix
          TAURI_ENV_TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: cargo build --release

      - name: Create pacman package
        run: |
          VERSION="${{ needs.prepare.outputs.release_tag }}"
          VERSION="${VERSION#v}"

          # makepkg refuses to run as root — create a dedicated builder user
          useradd -m builder

          # Copy pre-built artifacts to a builder-owned staging area
          mkdir -p /tmp/pkgbuild/files
          cp "target/release/fixplay-tauri"           /tmp/pkgbuild/files/
          cp "src-tauri/resources/error_codes.json"   /tmp/pkgbuild/files/
          cp "src-tauri/binaries/flashrom"            /tmp/pkgbuild/files/
          cp "src-tauri/icons/icon_256x256.png"       /tmp/pkgbuild/files/

          printf '[Desktop Entry]\nName=fixplay-diagnoseTool\nComment=Cross-platform diagnostic tool for gaming consoles\nExec=fixplay-diagnosetool\nIcon=fixplay-diagnosetool\nType=Application\nCategories=Utility;Development;\nTerminal=false\nStartupNotify=true\n' \
            > /tmp/pkgbuild/files/fixplay-diagnosetool.desktop

          # Generate PKGBUILD — package() references ${startdir}/files/ only
          {
            echo "pkgname=fixplay-diagnosetool"
            echo "pkgver=${VERSION}"
            echo "pkgrel=1"
            echo 'pkgdesc="Cross-platform diagnostic tool for gaming consoles"'
            echo "arch=('x86_64')"
            echo 'url="https://github.com/fabioudev/fixplay-diagnoseTool"'
            echo "license=('custom:unknown')"
            echo "depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator')"
            echo "provides=('fixplay-diagnosetool')"
            echo "conflicts=('fixplay-diagnosetool-bin')"
            echo "source=()"
            echo "sha256sums=()"
            echo ""
            echo "package() {"
            echo '  install -Dm755 "${startdir}/files/fixplay-tauri"                   "${pkgdir}/usr/bin/fixplay-diagnosetool"'
            echo '  install -Dm644 "${startdir}/files/error_codes.json"                "${pkgdir}/usr/lib/fixplay-diagnosetool/resources/error_codes.json"'
            echo '  install -Dm755 "${startdir}/files/flashrom"                        "${pkgdir}/usr/lib/fixplay-diagnosetool/binaries/flashrom"'
            echo '  install -Dm644 "${startdir}/files/icon_256x256.png"               "${pkgdir}/usr/share/icons/hicolor/256x256/apps/fixplay-diagnosetool.png"'
            echo '  install -Dm644 "${startdir}/files/fixplay-diagnosetool.desktop"   "${pkgdir}/usr/share/applications/fixplay-diagnosetool.desktop"'
            echo "}"
          } > /tmp/pkgbuild/PKGBUILD

          chown -R builder:builder /tmp/pkgbuild
          su builder -c "cd /tmp/pkgbuild && PACKAGER='GitHub Actions' makepkg --noconfirm --nodeps"
          cp /tmp/pkgbuild/fixplay-diagnosetool-*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Upload arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-bundles
          if-no-files-found: error
          path: "*.pkg.tar.zst"

  release:
    needs:
      - prepare
      - build
      - arch-build
    runs-on: ubuntu-latest

    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-bundles'
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          find . -type f | sort | xargs sha256sum > SHA256SUMS.txt

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: |
            release-assets/**
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.release_tag, '-') }}

  update-aur:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    if: "!contains(needs.prepare.outputs.release_tag, '-')"
    environment: aur-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        if: env.AUR_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur_deploy
          chmod 600 ~/.ssh/aur_deploy
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur_deploy
              User aur
              IdentitiesOnly yes
          EOF

      - name: Update PKGBUILD
        run: |
          VERSION="${{ needs.prepare.outputs.release_tag }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          PKGBUILD="packaging/aur/fixplay-diagnosetool-bin/PKGBUILD"

          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"

          cat "$PKGBUILD" | head -5

      - name: Generate .SRCINFO
        run: |
          cd packaging/aur/fixplay-diagnosetool-bin
          PKGVER=$(grep "^pkgver=" PKGBUILD | cut -d= -f2)
          PKGREL=$(grep "^pkgrel=" PKGBUILD | cut -d= -f2)
          {
            printf 'pkgbase = fixplay-diagnosetool-bin\n'
            printf '\tpkgdesc = Cross-platform diagnostic tool for gaming consoles (AppImage release build)\n'
            printf '\tpkgver = %s\n' "$PKGVER"
            printf '\tpkgrel = %s\n' "$PKGREL"
            printf '\turl = https://github.com/fabioudev/fixplay-diagnoseTool\n'
            printf '\tarch = x86_64\n'
            printf '\tlicense = custom:unknown\n'
            printf '\tdepends = fuse2\n'
            printf '\toptdepends = flashrom: use the system flashrom binary instead of the bundled one\n'
            printf '\tprovides = fixplay-diagnosetool\n'
            printf '\tconflicts = fixplay-diagnosetool\n'
            printf '\tsource = https://github.com/fabioudev/fixplay-diagnoseTool/releases/download/v%s/fixplay-diagnoseTool_%s_amd64.AppImage\n' "$PKGVER" "$PKGVER"
            printf '\tsource = https://raw.githubusercontent.com/fabioudev/fixplay-diagnoseTool/v%s/src-tauri/icons/icon_256x256.png\n' "$PKGVER"
            printf '\tsha256sums = SKIP\n'
            printf '\tsha256sums = SKIP\n'
            printf '\npkgname = fixplay-diagnosetool-bin\n'
          } > .SRCINFO

      - name: Commit to main repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          cd packaging/aur/fixplay-diagnosetool-bin
          git add PKGBUILD .SRCINFO
          git commit -m "chore: update AUR package to ${{ needs.prepare.outputs.release_tag }}" || true

          cd ../../../
          git push origin main || true

      - name: Clone and push to AUR
        run: |
          git clone ssh://aur@aur.archlinux.org/fixplay-diagnosetool-bin.git /tmp/aur-repo
          cp packaging/aur/fixplay-diagnosetool-bin/{PKGBUILD,.SRCINFO} /tmp/aur-repo/

          cd /tmp/aur-repo
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ needs.prepare.outputs.release_tag }}" || true
          git push origin master
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        if: env.AUR_SSH_KEY != ''
        continue-on-error: true

      - name: Print AUR update instructions
        run: |
          if [ -z "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
            echo "## ⚠️ AUR SSH Key Not Configured"
          else
            echo "## ✅ AUR Updated"
          fi
          echo ""
          echo "PKGBUILD and .SRCINFO have been updated for version: ${{ needs.prepare.outputs.release_tag }}"
          echo ""
          if [ -z "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
            echo "To enable automatic AUR pushes:"
            echo "  1. Follow docs/AUR_SSH_SETUP.md"
            echo "  2. Add AUR_SSH_PRIVATE_KEY secret to GitHub"
          fi

