version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
  # Cargo updates must point at the workspace root (single Cargo.toml +
  # Cargo.lock). Member-directory entries fail with
  # dependency_file_not_resolvable ("...not the workspace root") — one '/' entry
  # covers all workspace members.
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
